workflows:
  keepflow_notes_pro:
    name: KeepFlow Notes Pro Android Build

    max_build_duration: 60

    instance_type: linux   # ✅ FIXED

    environment:
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Checkout
        script: echo "Starting build..."

      - name: Grant permission
        script: chmod +x gradlew

      - name: Setup SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Clean
        script: ./gradlew clean

      - name: Build APK
        script: ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - prince.ar.abdur.rahman2008@gmail.com
