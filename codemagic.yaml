workflows:
  keepflow_notes_pro:
    name: KeepFlow Notes Pro

    max_build_duration: 60

    instance_type: linux   # ONLY FREE PLAN SAFE

    environment:
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Start
        script: echo "Build starting..."

      - name: Grant permission
        script: chmod +x gradlew

      - name: Setup SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Clean
        script: ./gradlew clean

      - name: Build Debug APK
        script: ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
