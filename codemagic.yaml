workflows:
  android-build:
    name: KeepFlow Notes Pro
    max_build_duration: 60

    instance_type: linux

    environment:
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Build Start
        script: echo "Starting build..."

      - name: Grant permission
        script: chmod +x gradlew

      - name: Setup SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Clean
        script: ./gradlew clean

      - name: Build APK
        script: ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
