workflows:
  keepflow-notes-pro:
    name: KeepFlow Notes Pro
    max_build_duration: 60

    instance_type: linux_x2   # Free plan compatible

    environment:
      java: 17
      android_signing: []     # IMPORTANT: no list error fix

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Checkout
        script: echo "Starting build..."

      - name: Grant permissions
        script: chmod +x gradlew

      - name: Create local.properties
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Clean project
        script: ./gradlew clean

      - name: Build Debug APK
        script: ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - prince.ar.abdur.rahman2008@gmail.com
